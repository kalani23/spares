name: Stock Sync Parallel

on:
  schedule:
    - cron: '0 0 * * *'    # 12:00am UK time (GMT, UTC+0) / 1:00am during BST
  workflow_dispatch:
    inputs:
      chunk_ids:
        description: 'Comma-separated chunk ids to retry (leave blank for full fresh run)'
        required: false
        default: ''

jobs:
  # ── Job 1: Split all SKUs into chunks (only on a fresh run, not a retry) ──
  split:
    if: ${{ github.event.inputs.chunk_ids == '' }}
    runs-on: ubuntu-latest
    outputs:
      chunk_ids: ${{ steps.split.outputs.chunk_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Split SKUs into chunks
        id: split
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          python split_chunks.py | tee split_output.log
          CHUNK_COUNT=$(grep -oP '(?<=chunk_count": )\d+' chunks/manifest.json || python -c "import json; print(json.load(open('chunks/manifest.json'))['chunk_count'])")
          IDS=$(python -c "print(','.join(str(i) for i in range($CHUNK_COUNT)))")
          echo "chunk_ids=$IDS" >> $GITHUB_OUTPUT
      - name: Commit chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f chunks/*.json
          git diff --staged --quiet || git commit -m "split chunks $(date -u +'%Y-%m-%d %H:%M')"
          git push

  # ── Job 2: Process each chunk in parallel (matrix) ─────────────────────────
  sync_chunks:
    needs: split
    if: ${{ always() && (needs.split.result == 'success' || github.event.inputs.chunk_ids != '') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        chunk_id: ${{ fromJson(
            github.event.inputs.chunk_ids != ''
              && format('[{0}]', github.event.inputs.chunk_ids)
              || format('[{0}]', needs.split.outputs.chunk_ids)
          ) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull latest (pick up chunks committed by split job)
        run: git pull origin ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml

      - name: Run chunk ${{ matrix.chunk_id }}
        id: chunk
        run: |
          set +e
          # Stagger start so 18 matrix jobs don't all hit partworks.de
          # in the exact same instant - spread across ~36s based on chunk_id
          STAGGER=$(( 5 + ${{ matrix.chunk_id }} * 3 + RANDOM % 4 ))
          echo "Staggering chunk ${{ matrix.chunk_id }} start by ${STAGGER}s"
          sleep "$STAGGER"
          python sync_chunk.py ${{ matrix.chunk_id }}
          CODE=$?
          set -e
          echo "$CODE" > chunk_exit_code.txt
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Chunk ${{ matrix.chunk_id }} exited with code $CODE"
          exit 0

      - name: Commit chunk results/checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git add -f results/results_*.json chunks/checkpoint_*.json 2>/dev/null || true
            git diff --staged --quiet && break
            git commit -m "chunk ${{ matrix.chunk_id }} result $(date -u +'%Y-%m-%d %H:%M')"
            git push origin ${{ github.ref_name }} && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
        continue-on-error: true

      - name: Record blocked chunk id
        run: |
          CODE=$(cat chunk_exit_code.txt 2>/dev/null || echo "${{ steps.chunk.outputs.exit_code }}")
          echo "Checking exit code for chunk ${{ matrix.chunk_id }}: $CODE"
          if [ "$CODE" = "2" ]; then
            echo "${{ matrix.chunk_id }}" >> blocked_chunks.txt
            echo "is_blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_blocked=false" >> "$GITHUB_OUTPUT"
          fi
        id: blockcheck

      - name: Upload blocked-chunk marker
        if: steps.blockcheck.outputs.is_blocked == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blocked-${{ matrix.chunk_id }}
          path: blocked_chunks.txt
          retention-days: 1
          overwrite: true

  # ── Job 3: Check for any blocked chunks and retrigger just those ───────────
  retrigger:
    needs: sync_chunks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all blocked-chunk markers
        uses: actions/download-artifact@v4
        with:
          pattern: blocked-*
          path: blocked_markers
        continue-on-error: true

      - name: Collect blocked chunk ids
        id: collect
        run: |
          if [ -d blocked_markers ]; then
            IDS=$(find blocked_markers -name "blocked_chunks.txt" -exec cat {} \; | sort -u | paste -sd, -)
          else
            IDS=""
          fi
          echo "ids=$IDS" >> $GITHUB_OUTPUT
          echo "Blocked chunk ids: $IDS"

      # NOTE: requires a Personal Access Token secret named GH_PAT with
      # the 'workflow' scope (default GITHUB_TOKEN cannot trigger workflows)
      - name: Retrigger blocked chunks only
        if: steps.collect.outputs.ids != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Retriggering blocked chunks: ${{ steps.collect.outputs.ids }}"
          gh workflow run stock_sync_parallel.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f chunk_ids="${{ steps.collect.outputs.ids }}"

  # ── Job 4: Merge + update Shopify (only when nothing is blocked) ──────────
  merge_and_update:
    needs: [sync_chunks, retrigger]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull latest (pick up all chunk results)
        run: git pull origin ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Check if any chunks still blocked
        id: check
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          from pathlib import Path

          chunk_dir = Path("chunks")
          results_dir = Path("results")
          still_blocked = False
          cleaned = []

          for cp_file in sorted(chunk_dir.glob("checkpoint_*.json")):
              chunk_id = cp_file.stem.replace("checkpoint_", "")
              chunk_file = chunk_dir / f"chunk_{chunk_id}.json"
              results_file = results_dir / f"results_{chunk_id}.json"

              expected_count = None
              if chunk_file.exists():
                  try:
                      expected_count = len(json.loads(chunk_file.read_text()))
                  except Exception:
                      pass

              actual_count = None
              if results_file.exists():
                  try:
                      actual_count = len(json.loads(results_file.read_text()))
                  except Exception:
                      pass

              if expected_count is not None and actual_count is not None and actual_count >= expected_count:
                  # Results file is complete - this checkpoint is stale, remove it
                  cp_file.unlink()
                  cleaned.append(str(cp_file))
              else:
                  print(f"Chunk {chunk_id} genuinely still blocked: expected {expected_count}, got {actual_count}")
                  still_blocked = True

          if cleaned:
              print(f"Cleaned up {len(cleaned)} stale checkpoint(s): {cleaned}")

          gh_output = os.environ.get("GITHUB_OUTPUT")
          with open(gh_output, "a") as f:
              f.write(f"still_blocked={'true' if still_blocked else 'false'}\n")
          PYEOF

      - name: Commit cleaned-up stale checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u chunks/checkpoint_*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "remove stale checkpoints $(date -u +'%Y-%m-%d %H:%M')"
          git push origin ${{ github.ref_name }} || true
        continue-on-error: true

      - name: Merge results and update Shopify
        if: steps.check.outputs.still_blocked == 'false'
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: python merge_and_update.py

      - name: Generate dashboard
        if: steps.check.outputs.still_blocked == 'false'
        run: python generate_dashboard.py

      - name: Commit merged log
        if: steps.check.outputs.still_blocked == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add -f sync_run_log.json history.json
          git diff --staged --quiet || git commit -m "merged sync $(date -u +'%Y-%m-%d %H:%M')"
          git push
        continue-on-error: true

      - name: Deploy dashboard to GitHub Pages
        if: steps.check.outputs.still_blocked == 'false'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          exclude_assets: '.github,*.py,proxies.txt,chunks,results'
        continue-on-error: true

      - name: Skip merge - chunks still blocked, waiting for retrigger
        if: steps.check.outputs.still_blocked == 'true'
        run: echo "Some chunks are still blocked and have been retriggered. Merge will run after they complete."
