name: Stock Sync

on:
  schedule:
    - cron: '30 19 * * *'   # 1:00am Sri Lanka time (UTC+5:30) = 19:30 UTC prev day
  workflow_dispatch:        # manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 lxml

      # Restore checkpoint from a previous (blocked) run, if any
      - name: Restore checkpoint
        uses: actions/download-artifact@v4
        with:
          name: checkpoint
          path: .
        continue-on-error: true

      - name: Run stock sync
        id: sync
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          python stock_sync_final.py
          CODE=$?
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT
          exit $CODE
        continue-on-error: true

      # Always commit the sync log, whatever happened
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sync_run_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "sync $(date -u +'%Y-%m-%d %H:%M')"
          git push
        continue-on-error: true

      # Build the dashboard from whatever sync_run_log.json has so far
      - name: Generate dashboard
        run: python generate_dashboard.py
        continue-on-error: true

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          exclude_assets: '.github,*.py,proxies.txt,checkpoint.json'
        continue-on-error: true

      # Blocked (exit code 2) -> save checkpoint as artifact for next run
      - name: Save checkpoint artifact
        if: steps.sync.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint
          path: checkpoint.json
          retention-days: 2
          overwrite: true

      # Blocked (exit code 2) -> trigger a brand-new run with a fresh IP
      # NOTE: requires a Personal Access Token secret named GH_PAT
      # (the default GITHUB_TOKEN is blocked by GitHub from triggering
      # other workflow runs, to prevent infinite loops). Create one at
      # https://github.com/settings/tokens with the 'workflow' (actions)
      # scope, then add it as a repo secret named GH_PAT.
      - name: Trigger resume run
        if: steps.sync.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Blocked (exit 2) - triggering new run with fresh IP..."
          gh workflow run stock_sync.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
