name: Stock Sync

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run stock sync chunk
        id: sync
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          CHUNK_SIZE: 200
          BLOCK_THRESHOLD: 5
        run: |
          set +e
          python stock_sync_final.py
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Script exit code: $CODE"
          exit 0

      - name: Generate dashboard
        run: |
          if [ -f generate_dashboard.py ]; then
            python generate_dashboard.py
          else
            echo "generate_dashboard.py missing, skipping dashboard"
          fi

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add -f sync_run_log.json checkpoint.json index.html 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync progress $(date -u +'%Y-%m-%d %H:%M')"
            git push origin main
          fi

      - name: Trigger next run
        if: steps.sync.outputs.exit_code == '2' || steps.sync.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Triggering next run. Exit code was ${{ steps.sync.outputs.exit_code }}"
          gh workflow run stock_sync.yml \
            --repo ${{ github.repository }} \
            --ref main

      - name: Fail on real script error
        if: steps.sync.outputs.exit_code != '0' && steps.sync.outputs.exit_code != '2' && steps.sync.outputs.exit_code != '3'
        run: exit 1
