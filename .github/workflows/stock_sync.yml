name: Stock Sync

on:
  schedule:
    - cron: '0 3 * * *'    # 3am UTC daily
  workflow_dispatch:        # manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 lxml

      # Restore checkpoint from a previous (blocked) run, if any
      - name: Restore checkpoint
        uses: actions/download-artifact@v4
        with:
          name: checkpoint
          path: .
        continue-on-error: true

      - name: Run stock sync
        id: sync
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          python stock_sync_final.py
          CODE=$?
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT
          exit $CODE
        continue-on-error: true

      # Always commit the sync log, whatever happened
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sync_run_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "sync $(date -u +'%Y-%m-%d %H:%M')"
          git push
        continue-on-error: true

      # Blocked (exit code 2) -> save checkpoint as artifact for next run
      - name: Save checkpoint artifact
        if: steps.sync.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint
          path: checkpoint.json
          retention-days: 2
          overwrite: true

      # Blocked (exit code 2) -> trigger a brand-new run with a fresh IP
      - name: Trigger resume run
        if: steps.sync.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Blocked (exit 2) - triggering new run with fresh IP..."
          gh workflow run stock_sync.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
